# DFCN runtime text replacement configuration
# Initial state. Shift+F10 toggles Chinese/native display for this session;
# dictionary reloads preserve the keyboard choice without rewriting this file.
enabled=true
mapping=dfcn/data/runtime/translations.tsv

# Apply the bundled recursive dfzh TOML rules to complete screen fragments.
# This handles generated combinations such as material + item names that
# cannot be enumerated in translations.tsv.
compositional_rules=true

# Sample visible text every few seconds and append deduplicated, not-fully-
# translated fragments to a review queue. Numeric values are normalized to
# {d}, preventing FPS/date/count changes from flooding the file.
collect_untranslated=true
untranslated_path=dfcn/data/runtime/untranslated.tsv
collect_interval_seconds=2
# Retain the existing review history while allowing new UI pages to be recorded.
# Reaching this limit now emits an explicit queue-full message in dfcn.log.
max_untranslated_entries=50000

# Leave empty to let Fontconfig choose a medium-weight Simplified-Chinese
# sans-serif face for clearer small-size strokes.
# You can instead copy a CJK font to dfcn/data/runtime/font.ttf,
# dfcn/data/runtime/font.otf, or dfcn/data/runtime/font.ttc.
# For a TTC collection, set font_index to the desired face.
font=
font_index=-1
# 0：读取原版字体图集的字母可见像素高度，按中文实际字形高度标定统一字号。
# 行高保留原版 UI 的行距；仅随字体和 UI 缩放改变，页面和文本长度不改变字号。
# 正数仍直接指定字体的 em 像素字号。
font_pixels=0
# Legacy layout hints only; they cannot override font_pixels or scale glyphs.
font_scale=0.92
min_font_pixels=6
horizontal_padding=1

# Legacy knowledge layout hint; rendered text uses the same font_pixels.
knowledge_font_scale=1.0

# Limit GPU textures created by procedural names/numbers during long sessions.
max_cached_textures=2048

# Translations share a font-specific reference line and baseline, including
# room for descenders and an editing cursor even while it is not visible.
# Changing digits, colors or cursor visibility does not refit the row height.
# Automatic font sizing fits this reference inside the native UI row.
# All glyphs retain their original pixel dimensions. Overflow expands the
# translated drawing region and adds wrapped rows; it never crops the text,
# inserts an ellipsis, shrinks the font, or stretches the glyph bitmaps.

# On 53.16 the SDL_RenderCopy hook suppresses original glyphs in both the
# ordinary per-tile path and update_all()'s inlined top-layer path, while
# keeping graphical layers intact. This option controls the background-color
# repaint fallback used if glyph-copy suppression is unavailable.
clear_background=true

# The files are checked once per second. Ctrl+Shift+F10 also forces a reload.
hot_reload=true
log_matches=false
# Optional passive render-stage timings; no input is generated.
trace_render_timing=false

# Ctrl+F9 dumps the current rendered character grid into dfcn/data/extracted/dumps/.
dump_first_screen=false

# Diagnostic option used by the runtime smoke test.
capture_first_match=false
capture_path=dfcn/data/extracted/capture-first-match.bmp
