base = "items::shield"

[[rulesets]]
[rulesets.rules]
"{default}" = "{default}"
"{singular}" = "{singular}"
"{plural}" = "{plural}"

[[rulesets]]
name = "default"
[rulesets.rules]
"{default::^0}{default::main}" = "{default::^0}{default::main}"

[[rulesets]]
name = "default::^0"
optional = true
[rulesets.rules]
"{::materials::item_qualifier} " = "{::materials::item_qualifier}"

[[rulesets]]
name = "default::main"
[rulesets.rules]
"shield/buckler" = "盾牌/小盾"
"shields/bucklers" = "盾牌/小盾"

[[rulesets]]
name = "singular"
[rulesets.rules]
"{^material}{singular::main}" = "{^material}{singular::main}"

[[rulesets]]
name = "plural"
[rulesets.rules]
"{^material}{plural::main}" = "{^material}{plural::main}"

[[rulesets]]
name = "^material"
optional = true
[rulesets.rules]
"{::materials::item_qualifier} " = "{::materials::item_qualifier}"

[[rulesets]]
name = "singular::main"
[rulesets.rules]
"shield" = "盾牌"
"buckler" = "小盾"

[[rulesets]]
name = "plural::main"
[rulesets.rules]
"shields" = "盾牌"
"bucklers" = "小盾"
