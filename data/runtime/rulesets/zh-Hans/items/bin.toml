base = "items::bin"

[[rulesets]]
[rulesets.rules]
# Empty material qualifiers and filled contents use the barrel/bag resolver.
# There is no independent contents + bin + (material) spelling.
"{::items::storage_container}" = "{::items::storage_container}"

[[rulesets]]
name = "main"
[rulesets.rules]
"bin" = "储物箱"
"bins" = "储物箱"

# Native bin-content categories, not complete names tied to a wood or count.
# Other categories reuse their existing typed item vocabulary.
[[rulesets]]
name = "contents"
[rulesets.rules]
"ammo" = "弹药"
"bar/block" = "锭块"
"finished goods" = "成品"
"{::items::coin::main}" = "{::items::coin::main}"
"{::items::sheet::main}" = "{::items::sheet::main}"
"{::items::smallgem}" = "{::items::smallgem}"
"{::items::cloth::main}" = "{::items::cloth::main}"
"{::items::armor::default::main}" = "{::items::armor::default::main}"
"{::items::weapon::default::main}" = "{::items::weapon::default::main}"
