# Unit status is not just job_type. Sources and the complete formatter graph:
# data/extracted/unit-activity-sources.tsv / data/extracted/unit-activity-source-review.md.
# Activity grammar is entered by the shared activity translator; its literal
# topic vocabulary is also bound by academic records in the knowledge list.
# It is not a global word grammar and never treats a status as a person's name.
