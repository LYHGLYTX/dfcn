base = "health::contaminant"

[[rulesets]]
[rulesets.rules]
# Native unit-contaminant name constructor: Steam RVA 0x657f90,
# classic RVA 0x6559b0. Powder state 3 and amounts <25 / 25..49 / >=50
# select six suffixes; material types 219..418 use five "of" prefixes.
# All twelve native branch combinations share these eleven productions.
# Non-powder amounts progress from spatter to smear to covering/coating.
"{material} specks" = "少量{material}"
"{material} dusting" = "薄薄一层{material}"
"{material} coating" = "覆上了一层{material}"
"{material} spatter" = "溅上了少量{material}"
"{material} smear" = "沾上了一些{material}"
"{material} covering" = "覆上了一层{material}"
"specks of {material}" = "少量{material}"
"dusting of {material}" = "薄薄一层{material}"
"coating of {material}" = "覆上了一层{material}"
"spatter of {material}" = "溅上了少量{material}"
"smear of {material}" = "沾上了一些{material}"

# Native map look/hover captions: the quantity precedes a complete material
# name, including creature/plant prefixes and material phases. Keep all
# seven surface-deposit amounts here rather than enumerating species or
# translating only the material tail. Native ELF literals: 0x1d319c1..0x1d31a16.
"A spattering of {material}" = "少量溅落的{material}"
"A smear of {material}" = "一抹{material}"
"A pool of {material}" = "一滩{material}"
"A thin layer of {material}" = "薄薄一层{material}"
"A dusting of {material}" = "薄薄一层{material}"
"A small pile of {material}" = "一小堆{material}"
"A pile of {material}" = "一堆{material}"

[[rulesets]]
name = "material"
[rulesets.rules]
# The shared complete material noun resolver includes native phase/prefix
# names, personal owners and generated substances from the existing glossary.
"{::text::material}" = "{::text::material}"

[[rulesets]]
name = "inventory"
[rulesets.rules]
"{::health::contaminant} ({::health::bodypart})" = "{::health::contaminant}（{::health::bodypart}）"
"{::health::contaminant}" = "{::health::contaminant}"
# Bare headings belong only to a confirmed Items panel. In particular,
# covering is not a new global replacement for the ordinary English verb.
"spatter" = "飞溅"
"smear" = "沾染"
"covering" = "覆盖"
