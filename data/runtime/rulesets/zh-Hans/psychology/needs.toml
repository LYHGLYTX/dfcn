base = "psychology::needs"

[[rulesets]]
[rulesets.rules]
"{main}" = "{main}"

[[rulesets]]
name = "main"
[rulesets.rules]
# Focus describes attention, not happiness. Do not add duration, frequency,
# inability to act, or emotional distress absent from the English statement.
"Overall,{sex} is very focused with satisfied needs{tail}" = "总体而言，{sex}的需求得到满足，因而十分专注{tail}"
"Overall,{sex} is quite focused with satisfied needs{tail}" = "总体而言，{sex}的需求得到满足，因而相当专注{tail}"
"Overall,{sex} is somewhat focused with satisfied needs{tail}" = "总体而言，{sex}的需求得到满足，因而较为专注{tail}"
"Overall,{sex} is badly distracted by unmet needs{tail}" = "总体而言，需求未得到满足，使{sex}严重分心{tail}"
"Overall,{sex} is distracted by unmet needs{tail}" = "总体而言，需求未得到满足，使{sex}分心{tail}"
"Overall,{sex} is unfocused by unmet needs{tail}" = "总体而言，需求未得到满足，使{sex}注意力不集中{tail}"
"Overall,{sex} is untroubled by unmet needs{tail}" = "总体而言，{sex}并不因需求尚未满足而感到困扰{tail}"
"{sex} is unfettered {things::fulfilled}{tail}" = "{sex}{things::fulfilled}，心无牵挂{tail}"
"{sex} is level-headed {things::fulfilled}{tail}" = "{sex}{things::fulfilled}，头脑清醒{tail}"
"{sex} is untroubled {things::fulfilled}{tail}" = "{sex}{things::fulfilled}，心无烦忧{tail}"
"{sex} is not distracted {things::unfulfilled}{tail}" = "虽然{sex}{things::unfulfilled}，但并未因此分心{tail}"
"{sex} is unfocused {things::unfulfilled}{tail}" = "{sex}因{things::unfulfilled}而注意力不集中{tail}"
"{sex} is distracted {things::unfulfilled}{tail}" = "{sex}因{things::unfulfilled}而分心{tail}"
"{sex} is badly distracted {things::unfulfilled}{tail}" = "{sex}因{things::unfulfilled}而严重分心{tail}"

