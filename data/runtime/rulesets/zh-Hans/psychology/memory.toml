# Dwarf Fortress.exe's memory constructor (0x140482e00-0x1404842d4)
# selects one of 50 personality facets and one of 33 values. Both directions
# belong here, including changes that did not occur in the supplied memories.
[[rulesets]]
name = "change"
[rulesets.rules]
"Became {trait_change} and learned to {value_direction} {value}{tail}" = "变得{trait_change}，并开始{value_direction}{value}。"
"Became {trait_change}{tail}" = "变得{trait_change}。"
"Learned to {value_direction} {value}{tail}" = "开始{value_direction}{value}。"

