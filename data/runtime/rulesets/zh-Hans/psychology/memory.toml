base = "psychology::memory"

[[rulesets]]
[rulesets.rules]
"{main}" = "{main}"
# Native memories can end in one trait change, one value change, or both.
# Keep the separator outside the continuation so its purple color is retained.
"{main} {change}" = "{main}{change}"
"{change}" = "{change}"

[[rulesets]]
name = "main"
[rulesets.rules]
# The separator belongs to the constructor, not the colored action leaf.
"{mind::text} {::psychology::thought::memory_action::dwelling} {things}{tail}" = "{mind::text}地{::psychology::thought::memory_action::dwelling}一段{things}的经历。"
"{mind::text} {::psychology::thought::memory_action::remembering} {things}{tail}" = "{mind::text}地{::psychology::thought::memory_action::remembering}{things}的经历。"
"{mind::text} {::psychology::thought::memory_action::reliving} {things}{tail}" = "{mind::text}地{::psychology::thought::memory_action::reliving}{things}的经历。"
"{::psychology::thought::mind::predicate} {::psychology::thought::memory_action::dwelling} {things}{tail}" = "{::psychology::thought::memory_action::dwelling}一段{things}的经历时，{::psychology::thought::mind::predicate}。"
"{::psychology::thought::mind::predicate} {::psychology::thought::memory_action::remembering} {things}{tail}" = "{::psychology::thought::memory_action::remembering}{things}的经历时，{::psychology::thought::mind::predicate}。"
"{::psychology::thought::mind::predicate} {::psychology::thought::memory_action::reliving} {things}{tail}" = "{::psychology::thought::memory_action::reliving}{things}的经历时，{::psychology::thought::mind::predicate}。"
"{season} {#digits}" = "第{#digits}年{season}"
"Time before time" = "时间诞生之前"

[[rulesets]]
name = "things"
[rulesets.rules]
"{::psychology::event}" = "{::psychology::event}"

