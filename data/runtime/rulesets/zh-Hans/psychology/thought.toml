# or both can change. The three pronoun forms are generated by native gender.
[[rulesets]]
name = "recurring_change"
[rulesets.rules]
"and mulling over the recurring memory {recurring_effect}{tail}" = "反复思索这段记忆，{recurring_effect}。"

