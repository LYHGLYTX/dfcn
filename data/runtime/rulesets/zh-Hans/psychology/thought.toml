base = "psychology::thought"

[[rulesets]]
[rulesets.rules]
"{main}" = "{main}"
# The native recurring-memory continuation starts after a comma and changes
# color at `and`, so its separator must remain outside the captured reference.
"{main}, {recurring_change}" = "{main}{recurring_change}"

[[rulesets]]
name = "main"
[rulesets.rules]
"{sex}{kind}{mind::text} {things}{tail}" = "{things}，{sex}{kind}{mind::text}。"
"{sex}{kind}{mind::text} {memory_action::dwelling} {things}{tail}" = "{sex}因{memory_action::dwelling}一段{things}的经历{kind}{mind::text}。"
"{sex}{kind}{mind::text} {memory_action::remembering} {things}{tail}" = "{sex}因{memory_action::remembering}{things}的经历{kind}{mind::text}。"
"{sex}{kind}{mind::text} {memory_action::reliving} {things}{tail}" = "{sex}因{memory_action::reliving}{things}的经历{kind}{mind::text}。"
# These reactions are complete predicates, not nouns after 感到.
# Keep each source reference so the emotion retains its native color.
"{sex}{predicate_kind}{mind::predicate} {things}{tail}" = "{things}，{sex}{predicate_kind}{mind::predicate}。"
"{sex}{predicate_kind}{mind::predicate} {memory_action::dwelling} {things}{tail}" = "{sex}{memory_action::dwelling}一段{things}的经历时，{predicate_kind}{mind::predicate}。"
"{sex}{predicate_kind}{mind::predicate} {memory_action::remembering} {things}{tail}" = "{sex}{memory_action::remembering}{things}的经历时，{predicate_kind}{mind::predicate}。"
"{sex}{predicate_kind}{mind::predicate} {memory_action::reliving} {things}{tail}" = "{sex}{memory_action::reliving}{things}的经历时，{predicate_kind}{mind::predicate}。"
# Native grief/rage/panic constructors are verbs and do not include is/felt.
"{sex}{reaction} {things}{tail}" = "{things}，{sex}{reaction}。"
"{sex}{reaction} {memory_action::dwelling} {things}{tail}" = "{sex}因{memory_action::dwelling}一段{things}的经历而{reaction}。"
"{sex}{reaction} {memory_action::remembering} {things}{tail}" = "{sex}因{memory_action::remembering}{things}的经历而{reaction}。"
"{sex}{reaction} {memory_action::reliving} {things}{tail}" = "{sex}因{memory_action::reliving}{things}的经历而{reaction}。"

# Native memory actions carry their own colors independently of the emotion.
# Keep spaces outside each reference: its first source byte must be the
# highlighted word, not the preceding ordinary-colored separator. Memories
# reuse these same leaves so origin tracking has one semantic vocabulary.
[[rulesets]]
name = "memory_action::dwelling"
[rulesets.rules]
"dwelling upon" = "沉思"

[[rulesets]]
name = "memory_action::remembering"
[rulesets.rules]
"remembering" = "回忆起"

[[rulesets]]
name = "memory_action::reliving"
[rulesets.rules]
"reliving" = "重温"

[[rulesets]]
name = "things"
[rulesets.rules]
"{::psychology::event}" = "{::psychology::event}"

[[rulesets]]
name = "sex"
[rulesets.rules]
"He " = "他"
"She " = "她"
"It " = "它"

