base = "tiles"

# Native terrain compositor: PE 0x140e7d330..0x140e8482c. Text-producing
# branches end at 0x140e834ce; the tail includes switch tables. It emits plant, floor,
# stair, slope, track and wall-family productions; spaces belong to the
# adjacent literal, not to an independently translated screen fragment.
# Plant parts: 0x1413ffd20. Construction materials: 0x140a46f20.
# The complete native literal inventory is kept in data/extracted/tile-hover-sources.tsv.
# Used by the complete terrain-caption compositor. Growth names and tree
# parts continue to come from the existing plant/tile namespaces below.
[[rulesets]]
name = "growth_separator"
[rulesets.rules]
", " = "、"

[[rulesets]]
[rulesets.rules]
"{^0}{^1}{^2}{^3}{^4}{main}" = "{^0}{^1}{^2}{^3}{^4}{main}"
# Info-sheet terrain titles pass false for the native growth-list flag, but
# named trees, saplings and shrubs retain their typed name/species prefix.
# Keep that production reachable from the same tile root as ordinary terrain.
"{named_plant}" = "{named_plant}"

# Named trees, saplings and shrubs prepend their name before the species
# description; subsequent comma entries still belong to the growth list.
# 0x140e7d749, 0x140e7f9b5, 0x140e7fb10 call the native name formatter.
[[rulesets]]
name = "named_plant"
[rulesets.rules]
"{^2}{^3}{^4}{::text::name}, {named_plant::kind}" = "{::text::name}（{^2}{^3}{^4}{named_plant::kind}）"

# Only the native tree/shrub/sapling branches can own this leading name.
# Standalone foliage belongs to a following growth list, not to this field.
[[rulesets]]
name = "named_plant::kind"
[rulesets.rules]
"{prefix::may_dead}Tree" = "{prefix::may_dead}树"
"{prefix::may_dead}Shrub" = "{prefix::may_dead}灌木"
"{prefix::may_dead}Sapling" = "{prefix::may_dead}树苗"
"{prefix::may_dead}{plants::tile}" = "{prefix::may_dead}{plants::tile}"
"{prefix::may_dead}Young {plants::tile}" = "{prefix::may_dead}幼体{plants::tile}"
"{prefix::may_dead}{plants::tile} Sapling" = "{prefix::may_dead}{plants::tile}树苗"

[[rulesets]]
name = "^0"
optional = true
[rulesets.rules]
"Warm " = "温暖"

[[rulesets]]
name = "^1"
